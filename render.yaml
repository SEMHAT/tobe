# Déploiement en un clic sur Render (https://render.com) : API + application, disque persistant.
services:
  - type: web
    name: tobe
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: tobe-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ADMIN_EMAILS
        sync: false
      - key: EXPOSE_OTP
        value: "false"
      - key: RESEND_API_KEY
        sync: false
